name: ${COMPOSE_PROJECT_NAME:-overnight-web-agent-kit}

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      APP_ENV: production
      APP_NAME: overnight-web-agent-kit-api
      AIPOT_CONTENT_ROOT: /aipot-content
      AIPOT_HISTORY_FILE: /app/data/aipot-history.json
      AIPOT_DATABASE_FILE: /app/data/aipot.sqlite3
      AIPOT_SANDBOX_SOCKET: /aipot-sandbox/aipot-runner.sock
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      AIPOT_JUDGE_MODEL: ${AIPOT_JUDGE_MODEL:-anthropic/claude-haiku-4.5}
      AIPOT_TEXT_MODEL: ${AIPOT_TEXT_MODEL:-anthropic/claude-haiku-4.5}
      AIPOT_IMAGE_MODEL: ${AIPOT_IMAGE_MODEL:-openai/gpt-image-1}
    volumes:
      - ../../cgma_git/study/aipot/실전모의고사:/aipot-content:ro
      - aipot_history:/app/data
      - aipot_sandbox_socket:/aipot-sandbox
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net

  aipot-sandbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: aipot-sandbox
    environment:
      AIPOT_SANDBOX_SOCKET: /aipot-sandbox/aipot-runner.sock
    volumes:
      - aipot_sandbox_socket:/aipot-sandbox
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    cpus: "0.50"
    restart: unless-stopped
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_API_ORIGIN: ${NEXT_API_ORIGIN:-http://api:8000}
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-http}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      INTERNAL_API_ORIGIN: http://api:8000
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_net

  caddy:
    image: caddy:2.10-alpine
    profiles:
      - production
    ports:
      # Listen on every host IPv4 interface. This keeps LAN access working when
      # DHCP or an interface change assigns a new address. Set
      # HOST_BIND_ADDRESS explicitly only when access must be restricted.
      - "${HOST_BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-18080}:18080"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:18080/health/ready || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  aipot_history:
  aipot_sandbox_socket:
